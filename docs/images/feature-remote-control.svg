<svg viewBox="0 0 1280 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Run from Telegram or Discord — trigger and monitor automations from your phone">
  <defs>
    <linearGradient id="bg-rc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="blueGlow-rc" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#3363AD" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3363AD" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow-rc" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="540" fill="url(#bg-rc)"/>
  <rect width="1280" height="540" fill="url(#blueGlow-rc)"/>

  <!-- Section label -->
  <text x="80" y="70"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="14"
        font-weight="600"
        fill="#3363AD"
        letter-spacing="2">RUN FROM ANYWHERE</text>
  <text x="80" y="108"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="32"
        font-weight="700"
        fill="#18181B"
        letter-spacing="-0.8">Trigger from Telegram or Discord</text>
  <text x="80" y="138"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="15"
        font-weight="400"
        fill="#71717A">Hand a task to your Linefox while you're out. Your desktop does the work, your phone gets the result.</text>

  <!-- Telegram card (left) -->
  <g filter="url(#cardShadow-rc)">
    <rect x="80" y="180" width="540" height="320" rx="14" ry="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
  </g>

  <!-- Telegram header -->
  <g transform="translate(112, 207)">
    <circle cx="6" cy="0" r="5" fill="#229ED9"/>
    <text x="22" y="4"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="600"
          fill="#27272A">@linefox_bot · Telegram</text>
  </g>
  <line x1="80" y1="226" x2="620" y2="226" stroke="#F4F4F5" stroke-width="1"/>

  <!-- Telegram user message -->
  <g transform="translate(232, 250)">
    <rect x="0" y="0" width="356" height="56" rx="14" fill="#EFF6FF"/>
    <text x="20" y="22"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="500"
          fill="#27272A">Check if AAPL beat earnings yesterday and</text>
    <text x="20" y="40"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="500"
          fill="#27272A">summarize what management said about AI</text>
  </g>

  <!-- Telegram bot reply -->
  <g transform="translate(112, 322)">
    <rect x="0" y="0" width="476" height="148" rx="14" fill="#F9FAFB" stroke="#F4F4F5" stroke-width="1"/>
    <text x="20" y="24"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="600"
          fill="#3363AD">Linefox · 4 steps · 23s</text>
    <text x="20" y="48"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          fill="#27272A">✓ Beat: EPS $2.40 vs $2.35 est, rev $94.9B vs $94.5B est.</text>
    <text x="20" y="68"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          fill="#27272A">✓ AI commentary: Apple Intelligence rollout on track,</text>
    <text x="20" y="84"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          fill="#27272A">   on-device LLM driving iPhone 16 upgrade cycle,</text>
    <text x="20" y="100"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          fill="#27272A">   no firm timeline on Siri 2.0 (CFO Maestri).</text>
    <text x="20" y="124"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="12"
          fill="#71717A">Source: investor.apple.com Q4 FY25 release</text>
  </g>

  <!-- Discord card (right) -->
  <g filter="url(#cardShadow-rc)">
    <rect x="660" y="180" width="540" height="320" rx="14" ry="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
  </g>

  <!-- Discord header -->
  <g transform="translate(692, 207)">
    <circle cx="6" cy="0" r="5" fill="#5865F2"/>
    <text x="22" y="4"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="600"
          fill="#27272A">#linefox · Discord</text>
  </g>
  <line x1="660" y1="226" x2="1200" y2="226" stroke="#F4F4F5" stroke-width="1"/>

  <!-- Discord user message -->
  <g transform="translate(692, 254)">
    <circle cx="14" cy="14" r="14" fill="#5865F2"/>
    <text x="14" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">P</text>
    <text x="40" y="10"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="700"
          fill="#27272A">pasha</text>
    <text x="84" y="10"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="11"
          fill="#A1A1AA">today at 3:42 PM</text>
    <text x="40" y="30"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          fill="#27272A">Run the weekly competitor scrape</text>
  </g>

  <!-- Discord bot acknowledgement -->
  <g transform="translate(692, 322)">
    <circle cx="14" cy="14" r="14" fill="#3363AD"/>
    <text x="14" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">L</text>
    <text x="40" y="10"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="700"
          fill="#3363AD">Linefox</text>
    <rect x="78" y="-1" width="36" height="14" rx="3" fill="#3363AD"/>
    <text x="96" y="9" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">BOT</text>
    <text x="40" y="30"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          fill="#27272A">On it — running &lt;Competitor SKU scrape&gt;</text>
  </g>

  <!-- Discord bot completion -->
  <g transform="translate(692, 384)">
    <circle cx="14" cy="14" r="14" fill="#3363AD"/>
    <text x="14" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">L</text>
    <text x="40" y="10"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="700"
          fill="#3363AD">Linefox</text>
    <text x="40" y="30"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13"
          fill="#27272A">Done. 6/6 prices logged, 2 changed since last week:</text>
    <text x="40" y="50"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12"
          fill="#27272A">  • Acme Pro-12 · <tspan fill="#DC2626">$249 → $229</tspan> (-8%)</text>
    <text x="40" y="68"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12"
          fill="#27272A">  • Bolt-X · <tspan fill="#059669">$179 → $189</tspan> (+6%)</text>
    <!-- Attachment chip -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="176" height="26" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="6" y="6" width="14" height="14" rx="2" fill="#10B981"/>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#475569">competitors_2026-05-19.csv</text>
    </g>
  </g>
</svg>
