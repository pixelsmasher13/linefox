<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three bounded streams feed the agent each turn — Memory, Current State, Recent Actions">
  <defs>
    <linearGradient id="bg-ma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <filter id="cardShadow-ma" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowHead-ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3363AD"/>
    </marker>
  </defs>

  <rect width="1280" height="660" fill="url(#bg-ma)"/>

  <!-- Outer card -->
  <g filter="url(#cardShadow-ma)">
    <rect x="40" y="40" width="1200" height="520" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
  </g>

  <!-- ===== Three stream boxes ===== -->
  <!-- MEMORY -->
  <g transform="translate(80, 76)">
    <rect x="0" y="0" width="360" height="200" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="40" rx="10" fill="#EFF6FF"/>
    <rect x="0" y="28" width="360" height="12" fill="#EFF6FF"/>
    <text x="20" y="25"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13" font-weight="700" fill="#1E3A8A" letter-spacing="0.8">MEMORY</text>
    <text x="340" y="25" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#3B82F6">~1–3k tok</text>

    <text x="20" y="62"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="12" font-weight="500" fill="#475569">What the agent chose to remember</text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#334155">
      <text x="20" y="90">• Tesla automotive Q4: $77.07B</text>
      <text x="20" y="112">• Energy segment: $10.09B</text>
      <text x="20" y="134">• Services: $10.53B (verified)</text>
      <text x="20" y="156">• 10-K filing URL saved</text>
    </g>
    <text x="20" y="184"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="11" font-style="italic" fill="#94A3B8">LLM-curated · written via MEMORY_SAVE</text>
  </g>

  <!-- CURRENT STATE -->
  <g transform="translate(460, 76)">
    <rect x="0" y="0" width="360" height="200" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="40" rx="10" fill="#ECFDF5"/>
    <rect x="0" y="28" width="360" height="12" fill="#ECFDF5"/>
    <text x="20" y="25"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13" font-weight="700" fill="#065F46" letter-spacing="0.8">CURRENT STATE</text>
    <text x="340" y="25" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#10B981">~2–5k tok</text>

    <text x="20" y="62"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="12" font-weight="500" fill="#475569">A live snapshot of the world right now</text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#334155">
      <text x="20" y="90">• App: Microsoft Excel</text>
      <text x="20" y="112">• Active sheet: Q4-2024-actuals</text>
      <text x="20" y="134">• Used range: A1:H50</text>
      <text x="20" y="156">• 47 actionable elements visible</text>
    </g>
    <text x="20" y="184"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="11" font-style="italic" fill="#94A3B8">Replaced wholesale every turn</text>
  </g>

  <!-- RECENT ACTIONS -->
  <g transform="translate(840, 76)">
    <rect x="0" y="0" width="360" height="200" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="40" rx="10" fill="#FEF3C7"/>
    <rect x="0" y="28" width="360" height="12" fill="#FEF3C7"/>
    <text x="20" y="25"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="13" font-weight="700" fill="#92400E" letter-spacing="0.8">RECENT ACTIONS</text>
    <text x="340" y="25" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#D97706">~1–2k tok</text>

    <text x="20" y="62"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="12" font-weight="500" fill="#475569">Sliding window · auto-compressed</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#334155">
      <text x="20" y="90">GOOGLE_SEARCH ✓ "Tesla 10-K"</text>
      <text x="20" y="110">FETCH_PAGES ✓ sec.gov/.../tsla</text>
      <text x="20" y="130">MEMORY_SAVE ✓ 3 segment figures</text>
      <text x="20" y="150" fill="#94A3B8" font-style="italic">[47 older actions: summarized]</text>
    </g>
    <text x="20" y="184"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="11" font-style="italic" fill="#94A3B8">Old entries compressed, never dropped</text>
  </g>

  <!-- System prompt strip -->
  <g transform="translate(80, 296)">
    <rect x="0" y="0" width="1120" height="40" rx="8" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="20" y="25"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#52525B">+ SYSTEM PROMPT</text>
    <text x="160" y="25"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="12" fill="#71717A">skills, command grammar, app-specific commands · ~5–8k tokens ·</text>
    <text x="660" y="25"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#3363AD">cached at ~10% via cache_control: ephemeral</text>
    <text x="1100" y="25" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#71717A">flat each turn</text>
  </g>

  <!-- Arrows from each stream box bottom (y=276 absolute) to agent (y=360) -->
  <path d="M 260 276 Q 260 340 600 360" fill="none" stroke="#3363AD" stroke-width="1.5" opacity="0.5"/>
  <path d="M 640 276 L 640 360" fill="none" stroke="#3363AD" stroke-width="1.5" opacity="0.5"/>
  <path d="M 1020 276 Q 1020 340 680 360" fill="none" stroke="#3363AD" stroke-width="1.5" opacity="0.5"/>

  <!-- AGENT pill -->
  <g transform="translate(540, 360)">
    <rect x="0" y="0" width="200" height="46" rx="23" fill="#3363AD"/>
    <text x="100" y="29" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">AGENT</text>
  </g>

  <!-- Down arrow -->
  <line x1="640" y1="406" x2="640" y2="436" stroke="#3363AD" stroke-width="1.5" marker-end="url(#arrowHead-ma)"/>

  <!-- One command output -->
  <g transform="translate(440, 442)">
    <rect x="0" y="0" width="400" height="40" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="200" y="25" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" font-weight="600" fill="#166534">EXCEL_TYPE:... ||  one command per turn</text>
  </g>

  <!-- Bottom stat strip -->
  <line x1="80" y1="508" x2="1200" y2="508" stroke="#E4E4E7" stroke-width="1"/>
  <text x="80" y="534"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="11" font-weight="700" fill="#52525B" letter-spacing="0.6">PER-TURN BILLED TOKENS (with prefix caching)</text>

  <!-- Table: left side, 3 columns × 4 rows -->
  <g transform="translate(80, 556)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12">
    <!-- Header row -->
    <text x="0"   y="0" fill="#A1A1AA" font-weight="600" letter-spacing="0.5">STEP</text>
    <text x="120" y="0" fill="#3363AD" font-weight="700" letter-spacing="0.5">LINEFOX</text>
    <text x="280" y="0" fill="#A1A1AA" font-weight="600" letter-spacing="0.5">TYPICAL THREAD AGENT</text>
    <line x1="-4" y1="8" x2="600" y2="8" stroke="#E4E4E7" stroke-width="1"/>

    <!-- Row: step 1 -->
    <text x="0"   y="28" fill="#71717A">1</text>
    <text x="120" y="28" fill="#27272A" font-weight="600">~3k</text>
    <text x="280" y="28" fill="#27272A">~5k</text>

    <!-- Row: step 10 -->
    <text x="0"   y="50" fill="#71717A">10</text>
    <text x="120" y="50" fill="#27272A" font-weight="600">~3k</text>
    <text x="280" y="50" fill="#DC2626">~35k</text>
    <text x="350" y="50" fill="#A1A1AA">(11×)</text>

    <!-- Row: step 30 -->
    <text x="0"   y="72" fill="#71717A">30</text>
    <text x="120" y="72" fill="#27272A" font-weight="600">~3k</text>
    <text x="280" y="72" fill="#DC2626">~95k</text>
    <text x="350" y="72" fill="#A1A1AA">(32×)</text>
  </g>

  <!-- Right-side callout -->
  <g transform="translate(820, 556)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#18181B">By step 30: ~30× cheaper per call</text>
    <text x="0" y="22" font-size="12" fill="#71717A">Linefox per-turn cost stays flat — the dynamic payload</text>
    <text x="0" y="38" font-size="12" fill="#71717A">is bounded. Thread-style agents grow linearly forever.</text>
  </g>
</svg>
