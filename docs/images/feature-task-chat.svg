    <rect x="0" y="0" width="760" height="60" rx="14" fill="#EFF6FF"/>
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#1E3A8A">Ship the local-dinners app — push the new menu UI to staging,</text>
    <text x="20" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#1E3A8A">smoke-test it, then promote to prod and post in #releases.</text>
  </g>

  <!-- Assistant: phase plan -->
  <g transform="translate(320, 268)">
    <circle cx="14" cy="14" r="14" fill="#3363AD"/>
    <text x="14" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">L</text>
    <text x="40" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#3363AD" letter-spacing="0.6">LINEFOX · PHASE PLAN</text>
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="14" fill="#18181B">3 phases planned. Pushing to staging first, then promoting.</text>
    <g transform="translate(40, 48)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" fill="#52525B">1. Build &amp; deploy to staging</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" fill="#52525B">2. Run smoke tests &amp; verify menu UI</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" fill="#52525B">3. Promote to production &amp; announce</text>
    </g>
  </g>

  <!-- Step 1 done -->
  <g transform="translate(320, 388)">
    <circle cx="10" cy="10" r="10" fill="#10B981"/>
    <polyline points="5.5,10.5 9,14 15,7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#27272A">TERMINAL_RUN</text>
    <text x="32" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#52525B">cd ~/Linefox/local-dinners &amp;&amp; npm run build:staging</text>
    <text x="880" y="14" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#71717A">18.4s</text>
  </g>

  <!-- Step 2 done -->
  <g transform="translate(320, 438)">
    <circle cx="10" cy="10" r="10" fill="#10B981"/>
    <polyline points="5.5,10.5 9,14 15,7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#27272A">TERMINAL_RUN</text>
    <text x="32" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#52525B">aws s3 sync dist/ s3://staging.local-dinners.app --delete</text>
    <text x="880" y="14" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#71717A">6.2s</text>
  </g>

  <!-- Step 3 done -->
  <g transform="translate(320, 488)">
    <circle cx="10" cy="10" r="10" fill="#10B981"/>
    <polyline points="5.5,10.5 9,14 15,7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#27272A">URL · staging.local-dinners.app/menu — verify new card layout</text>
    <text x="32" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#52525B">Menu loaded, card images visible, no console errors</text>
    <text x="880" y="14" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#71717A">3.1s</text>
  </g>

  <!-- Step 4 running -->
  <g transform="translate(320, 538)">
    <circle cx="10" cy="10" r="10" fill="#3363AD" opacity="0.18"/>
    <circle cx="10" cy="10" r="4" fill="#3363AD">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#27272A">TERMINAL_RUN</text>
    <text x="32" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#52525B">git tag v1.4.2 &amp;&amp; gh workflow run deploy-prod</text>
    <g transform="translate(800, 0)">
      <rect x="0" y="0" width="80" height="20" rx="10" fill="#EFF6FF"/>
      <circle cx="13" cy="10" r="3" fill="#3363AD">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">deploying</text>
    </g>
  </g>

  <!-- Step 5 queued -->
  <g transform="translate(320, 588)">
    <circle cx="10" cy="10" r="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" fill="#A1A1AA">Post in Slack #releases — version, URL, changelog</text>
  </g>

  <!-- Composer -->
  <rect x="320" y="640" width="880" height="48" rx="10" fill="#F9FAFB" stroke="#E4E4E7" stroke-width="1"/>
  <text x="340" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" fill="#A1A1AA">Type a follow-up, or hit ⌘+S to save this as a reusable automation…</text>
</svg>
