<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Linefox running a deploy task in the chat view">
  <defs>
    <linearGradient id="bg-tc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <filter id="cardShadow-tc" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1280" height="760" fill="url(#bg-tc)"/>

  <!-- App window -->
  <g filter="url(#cardShadow-tc)">
    <rect x="40" y="40" width="1200" height="680" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
  </g>

  <!-- Title bar -->
  <rect x="40" y="40" width="1200" height="40" rx="12" fill="#F8FAFC"/>
  <rect x="40" y="60" width="1200" height="20" fill="#F8FAFC"/>
  <circle cx="68" cy="60" r="6" fill="#FF5F57"/>
  <circle cx="88" cy="60" r="6" fill="#FEBC2E"/>
  <circle cx="108" cy="60" r="6" fill="#28C840"/>
  <text x="640" y="65" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="13" font-weight="500" fill="#71717A">Linefox</text>
  <line x1="40" y1="80" x2="1240" y2="80" stroke="#E4E4E7" stroke-width="1"/>

  <!-- Sidebar -->
  <rect x="40" y="80" width="240" height="640" fill="#FAFBFC"/>
  <line x1="280" y1="80" x2="280" y2="720" stroke="#E4E4E7" stroke-width="1"/>

  <!-- Home -->
  <g transform="translate(56, 100)">
    <g transform="translate(12, 16)" stroke="#52525B" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <polyline points="-5,1 0,-4 5,1 5,6 -5,6 -5,1"/>
      <line x1="-2" y1="6" x2="-2" y2="3"/><line x1="2" y1="6" x2="2" y2="3"/>
    </g>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#52525B">Home</text>
  </g>

  <!-- + New Task -->
  <g transform="translate(56, 134)">
    <g transform="translate(12, 16)" stroke="#52525B" stroke-width="1.5" stroke-linecap="round">
      <line x1="-4" y1="0" x2="4" y2="0"/>
      <line x1="0" y1="-4" x2="0" y2="4"/>
    </g>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#52525B">New Task</text>
  </g>

  <!-- Nav: Tasks (active) -->
  <g transform="translate(48, 170)">
    <rect x="0" y="0" width="216" height="32" rx="6" fill="#EBF8FF"/>
    <g transform="translate(20, 16)" stroke="#2B6CB0" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="6"/>
      <polyline points="0,-3 0,0 3,2"/>
    </g>
    <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B6CB0">Tasks</text>
  </g>

  <!-- Nav: Task Plans -->
  <g transform="translate(56, 210)">
    <g transform="translate(12, 16)" stroke="#52525B" stroke-width="1.3" fill="none" stroke-linejoin="round">
      <rect x="-5" y="-6" width="10" height="12" rx="1"/>
      <line x1="-3" y1="-3" x2="3" y2="-3"/>
      <line x1="-3" y1="0" x2="3" y2="0"/>
      <line x1="-3" y1="3" x2="2" y2="3"/>
    </g>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#52525B">Task Plans</text>
  </g>

  <!-- Nav: Skills -->
  <g transform="translate(56, 244)">
    <g transform="translate(12, 16)" stroke="#52525B" stroke-width="1.3" fill="none" stroke-linejoin="round">
      <polyline points="2,-6 -4,1 0,1 -2,6 4,-1 0,-1 2,-6"/>
    </g>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#52525B">Skills</text>
  </g>

  <!-- Nav: Calendar -->
  <g transform="translate(56, 278)">
    <g transform="translate(12, 16)" stroke="#52525B" stroke-width="1.3" fill="none" stroke-linejoin="round">
      <rect x="-5" y="-4" width="10" height="9" rx="1"/>
      <line x1="-5" y1="-1" x2="5" y2="-1"/>
      <line x1="-2" y1="-6" x2="-2" y2="-3"/>
      <line x1="2" y1="-6" x2="2" y2="-3"/>
    </g>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#52525B">Calendar</text>
  </g>

  <!-- Recent tasks -->
  <g transform="translate(56, 332)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#A1A1AA">RECENT TASKS</text>

    <g transform="translate(-4, 16)">
      <rect x="0" y="0" width="216" height="40" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
      <circle cx="14" cy="20" r="4" fill="#3363AD">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#18181B">Ship local-dinners app</text>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" fill="#A1A1AA">running · 4 steps</text>
    </g>

    <g transform="translate(-4, 64)">
      <circle cx="14" cy="20" r="4" fill="#10B981"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#52525B">Tesla 10-K research</text>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" fill="#A1A1AA">22m ago · done</text>
    </g>

    <g transform="translate(-4, 104)">
      <circle cx="14" cy="20" r="4" fill="#10B981"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#52525B">Morning portfolio digest</text>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" fill="#A1A1AA">today · 07:00</text>
    </g>

    <g transform="translate(-4, 144)">
      <circle cx="14" cy="20" r="4" fill="#10B981"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#52525B">Competitor SKU scrape</text>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" fill="#A1A1AA">today · 06:00</text>
    </g>

    <g transform="translate(-4, 184)">
      <circle cx="14" cy="20" r="4" fill="#10B981"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#52525B">Reply to Discord pings</text>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" fill="#A1A1AA">3h ago · 4 drafts</text>
    </g>

    <g transform="translate(-4, 224)">
      <circle cx="14" cy="20" r="4" fill="#A1A1AA"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#52525B">Q3 board deck draft</text>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" fill="#A1A1AA">yesterday · saved</text>
    </g>

    <g transform="translate(-4, 264)">
      <circle cx="14" cy="20" r="4" fill="#10B981"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#52525B">Slack invoice digest</text>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" fill="#A1A1AA">2 days ago · done</text>
    </g>
  </g>

  <!-- Execution header -->
