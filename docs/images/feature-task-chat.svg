    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#18181B">Ship local-dinners app to production</text>
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="68" height="22" rx="11" fill="#DBEAFE"/>
      <circle cx="14" cy="11" r="4" fill="#3363AD">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">Running</text>
    </g>
    <text x="80" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#71717A">started 14:22 · 42s elapsed</text>
    <text x="920" y="14" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" fill="#71717A">Claude Sonnet 4.5</text>
  </g>
  <line x1="300" y1="160" x2="1220" y2="160" stroke="#F4F4F5" stroke-width="1"/>

  <!-- User bubble (right-aligned) -->
