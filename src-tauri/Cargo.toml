[package]
name = "Linefox"
version = "0.0.1"
description = "Linefox"
authors = ["Heelix"]
license = ""
repository = ""
default-run = "Linefox"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1.0.40"
hnsw_rs = { git = "https://github.com/bwsw/hnswlib-rs.git" }

serde_json = "1.0"
tauri-plugin-oauth = { git = "https://github.com/FabianLars/tauri-plugin-oauth", branch = "v2" }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0.188"
tauri = { version = "2.0", features = [ "protocol-asset",
    "devtools",
    "tray-icon",
] }
chrono = "0.4"
async-std = "1.9.0"
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3", features = [] }
itertools = "0.13.0"
reqwest = { version = "0.12.3", features = ["json", "blocking"] }
openai_api_rust = "0.1.8"
similar = "2.4.0"
regex = "1.5.4"
dissimilar = "1.0.2"
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
fuzzy-matcher = "0.3"
lazy_static = "1.4.0"
async-openai = "0.23.3"
thiserror = "1"
rusqlite = { version = "0.29.0", features = ["bundled"] }
rusqlite-from-row = "0.2.0"
active-win-pos-rs = "0.9.1"
tauri-plugin-localhost = "2.0"
log = "^0.4"
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-positioner = { version = "2.0", features = [] }
sysinfo = "0.32"
strsim = "0.11.0"
diesel = { version = "2.1.3", features = ["sqlite"] }
diesel_migrations = "2.1.0"
tempfile = "3.10.1"
rand = "0.8"
urlencoding = "2.1"
uuid = { version = "1.6", features = ["v4"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
url = "2.5"
dirs = "5.0"
once_cell = "1.19"
sha2 = "0.10"
base64 = "0.22"
eventsource-stream = "0.2"
futures-util = "0.3"

[target."cfg(not(target_os = \"linux\"))".dependencies]
rdev = { git = "https://github.com/fufesou/rdev" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(not(target_os = \"windows\"))".dependencies]
strip-ansi-escapes = "0.2"

[target."cfg(any(target_os = \"macos\"))".dependencies]
core-graphics = "0.23.2"
core-foundation = "0.9.3"
accessibility = "0.1.6"
objc = "0.2"
accessibility-sys = "0.1.3"
applications = "0.2.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.28", features = ["signal"] }



[lib]
name = "heelix"
path = "src/lib.rs"

[[test]]
name = "tests-macos"
path = "tests/tests-macos.rs"
